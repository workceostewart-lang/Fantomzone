<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <meta
      name="description"
      content="Fantom Zone is a growing arcade of fast, playable browser games."
    />
    <title>Fantom Zone</title>
    <script data-fantomzone-cache-refresh>
      (function () {
        if (!location.hostname.endsWith("fantomzone.app")) return;
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations()
            .then(function (registrations) {
              return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
            })
            .catch(function () {});
        }
        if ("caches" in window) {
          caches.keys()
            .then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key); }));
            })
            .catch(function () {});
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <a id="fallback-christopher" href="https://implementing-applicable-scratch-reproductive.trycloudflare.com/" target="_blank" rel="noopener">Enter Christopher</a>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
